name: Tests

on:
  # Reused as release.yml's verify gate (workflow_call). No push:[main] trigger —
  # main is covered once via that gate; PRs via pull_request below.
  workflow_call:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'RELEASING.md'
      - 'NOTES.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.editorconfig'
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build types
        run: npm run build:types
